[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "DTZ", "UP", "B", "BLE", "SIM", "RET", "RUF", "PLR"
]
ignore = [
    "B008",
    "E501",
    "PLR0913",
    "PLR0917",
    "BLE001",
    "RET504",
    "SIM102",
    "B904",
    "B905",
    "I001",
    "UP042",
    "PLR2004",
    "UP017",
    "UP041"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
