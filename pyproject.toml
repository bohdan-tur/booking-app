[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "DTZ", "UP", "B", "BLE", "SIM", "RET", "RUF", "PLR"
]
ignore = [
    "B008",
    "E501",

]

[tool.ruff.lint.per-file-ignores]
"app/services/email.py" = ["PLR0913"]
"tests/*" = ["PLR2004", "PLR0913", "PLR0917"]
