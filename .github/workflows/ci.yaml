name: Booking App CI

on:
  push:
    branches: [main, master, "ci/**", "refactor/**", "feature/**", "chore/**"]
  pull_request:
    branches: [main, master]

jobs:
  verification:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/test_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
      ALGORITHM: HS256
      SECRET_KEY: ci-test-access-key-not-for-production
      REFRESH_SECRET_KEY: ci-test-refresh-key-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      ADMIN_DEFAULT_PASSWORD: ci-test-admin-password
      MANAGER_DEFAULT_PASSWORD: ci-test-manager-password
      USER_DEFAULT_PASSWORD: ci-test-user-password
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ci-test-user
      SMTP_PASSWORD: ci-test-password
      SMTP_TIMEOUT: "10"
      EMAIL_FROM: test@example.com
      TIMEZONE: UTC
      SUPPORT_EMAIL: support@example.com
      SUPPORT_PHONE: "+380000000000"
      DEBUG: "false"
      TESTING: "true"
      CORS_ORIGINS: '["http://localhost:3000"]'
      FLOWER_BASIC_AUTH: admin:ci-test-password

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Check code with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Verify migration lifecycle
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest -v tests/

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build runtime and test containers
        run: docker compose build backend tests
