x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}

x-database-env: &database-env
  DATABASE_URL: ${DATABASE_URL}

x-redis-env: &redis-env
  REDIS_URL: ${REDIS_URL}

x-auth-env: &auth-env
  ALGORITHM: ${ALGORITHM:-HS256}
  SECRET_KEY: ${SECRET_KEY}
  REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

x-smtp-env: &smtp-env
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-test_user}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-test_password}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
  EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}

x-seed-env: &seed-env
  SEED_DEFAULT_USERS: ${SEED_DEFAULT_USERS:-false}
  ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
  MANAGER_DEFAULT_PASSWORD: ${MANAGER_DEFAULT_PASSWORD}
  USER_DEFAULT_PASSWORD: ${USER_DEFAULT_PASSWORD}

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  TIMEZONE: ${TIMEZONE:-UTC}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
  SUPPORT_PHONE: ${SUPPORT_PHONE:-+1234567890}
  DEBUG: ${DEBUG:-false}

x-app-build: &app-build
  context: .
  target: production

services:
  db:
    image: postgres:15-alpine
    container_name: booking_db
    restart: always
    environment:
      <<: *postgres-env
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  alembic:
    build: *app-build
    container_name: booking_alembic
    command: alembic upgrade head
    volumes:
      - .:/app
    environment:
      <<: *database-env
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: *app-build
    container_name: booking_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      <<:
        - *database-env
        - *redis-env
        - *auth-env
        - *smtp-env
        - *seed-env
        - *app-env
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db_test:
    image: postgres:15-alpine
    container_name: booking_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build: *app-build
    container_name: booking_celery_worker
    command: celery -A app.workers.app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      <<:
        - *database-env
        - *redis-env
        - *smtp-env
        - *app-env
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery_beat:
    build: *app-build
    container_name: booking_celery_beat
    command: celery -A app.workers.app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      <<:
        - *database-env
        - *redis-env
        - *app-env
    depends_on:
      alembic:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  flower:
    profiles: ["monitoring"]
    build: *app-build
    container_name: booking_flower
    command:
      - celery
      - -A
      - app.workers.app
      - flower
      - --port=5555
      - --basic-auth=${FLOWER_BASIC_AUTH:-admin:admin}
    ports:
      - "5555:5555"
    environment:
      <<:
        - *redis-env
        - *app-env
    depends_on:
      redis:
        condition: service_healthy

  tests:
    build:
      context: .
      target: test
    container_name: test_bookings
    depends_on:
      db_test:
        condition: service_healthy
    environment:
      <<:
        - *database-env
        - *redis-env
        - *auth-env
        - *smtp-env
        - *seed-env
        - *app-env
      TEST_DATABASE_URL: ${TEST_DATABASE_URL}
      DATABASE_URL: ${TEST_DATABASE_URL}
      ENVIRONMENT: test
      DEBUG: "false"
    restart: "no"
    command: pytest -v tests/

volumes:
  postgres_data:
  redis_data:
