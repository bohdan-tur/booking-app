<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Booking System{% endblock %}</title>
</head>

<body style="margin:0;padding:24px;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#333;">

<div style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;box-shadow:0 2px 8px rgba(0,0,0,.08);">

    <h2 style="margin-top:0;">
        {% block heading %}{% endblock %}
    </h2>

    <p>
        Hello <strong>{{ user_name }}</strong>,
    </p>

    {% block content %}{% endblock %}

    <hr style="border:none;border-top:1px solid #e5e7eb;margin:32px 0;">

    <p style="font-size:14px;color:#666;margin-bottom:4px;">
        Need help?
    </p>

    <p style="font-size:14px;color:#666;margin:0;">
        Email: {{ support_email }}<br>
        Phone: {{ support_phone }}
    </p>

</div>

</body>
</html>
